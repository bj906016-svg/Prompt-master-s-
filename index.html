<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Masters | AI Prompt Engineering</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #111936;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #29345f;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #7c8cff;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    nav a:hover {
      color: #8f9cff;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 75px);
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #7c8cff;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #b8c0dd;
      font-size: 18px;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      margin: 8px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      background: #7c8cff;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid #56628f;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 70px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 35px;
      margin-bottom: 15px;
    }

    .section-text {
      text-align: center;
      color: #aeb7d4;
      margin-bottom: 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151d3b;
      border: 1px solid #29345f;
      border-radius: 16px;
      padding: 25px;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #91a0ff;
    }

    .card p {
      color: #b7bfd8;
    }

    .generator {
      background: #111936;
      border-radius: 20px;
      padding: 30px;
      border: 1px solid #29345f;
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      margin-bottom: 20px;
      background: #0b1020;
      color: white;
      border: 1px solid #39466f;
      border-radius: 10px;
      outline: none;
    }

    label {
      font-weight: bold;
    }

    #result {
      min-height: 130px;
      white-space: pre-wrap;
      background: #0b1020;
      border: 1px solid #39466f;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      color: #dce1f5;
    }

    .about-box {
      background: #151d3b;
      border-radius: 18px;
      padding: 30px;
      border: 1px solid #29345f;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      background: #070b17;
      color: #8f98b7;
      margin-top: 40px;
    }

    @media (max-width: 650px) {
      nav {
        flex-direction: column;
      }

      nav a {
        margin: 5px;
        font-size: 14px;
      }

      .hero {
        padding-top: 60px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <div class="logo">Prompt Masters</div>

      <div>
        <a href="#home">Home</a>
        <a href="#features">Features</a>
        <a href="#generator">Generator</a>
        <a href="#about">About</a>
      </div>
    </nav>
  </header>

  <main>

    <section class="hero" id="home">
      <h1>Master the Art of <span>AI Prompts</span></h1>

      <p>
        Prompt Masters helps you create clearer, smarter and more powerful
        prompts for AI tools. Build better prompts and get better results.
      </p>

      <div class="buttons">
        <a class="btn" href="#generator">Create a Prompt</a>
        <a class="btn secondary" href="#features">Explore Features</a>
      </div>
    </section>
